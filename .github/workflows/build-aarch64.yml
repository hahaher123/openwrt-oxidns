name: build-aarch64

# 单架构构建入口：只编 rockchip/armv8（NanoPi R2S，aarch64_generic）。
#
# 为什么单独一个工作流：armv8 的缓存 key 与 x86/64 不同，冷缓存时要现场编译
# Rust 工具链（数小时）。独立成 run 后，它的慢或失败不会影响 x86 的重跑，
# 也能单独看它的耗时趋势。
#
# 底层仍然复用 build.yml（通用、可传多个 target），这里只是把 targets 钉死。
# 自动发版走 upstream-watch.yml，它直接调用 build.yml 并传 BUILD_TARGETS。

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: OpenWrt release to build against
        required: true
        default: '25.12.6'
  workflow_call:
    inputs:
      sdk_version:
        description: OpenWrt release to build against
        type: string
        required: false
        default: '25.12.6'

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      sdk_version: ${{ inputs.sdk_version || '25.12.6' }}
      targets: '["rockchip/armv8"]'
