name: upstream-watch

# Every 24 hours: probe https://github.com/svenshi/oxidns for a new release.
# If the upstream version is newer than PKG_VERSION in the repo Makefile, this
# workflow bumps the package, commits the bump, rebuilds the packages for every
# target in BUILD_TARGETS and publishes them as a single GitHub Release.
#
# It also repairs hash drift: GitHub regenerates the archives it serves for a
# tag (and upstream may re-point a tag), so the same version can come back with
# different bytes. The probe recomputes PKG_HASH every run and commits it when it
# moved, even though the version did not — otherwise the repo keeps a hash that
# no longer matches the tarball and every build fails at download time.
#
# BUILD_TARGETS 只用于生成 Release 正文/标题里的架构说明。真正的构建按架构拆在
# build-x86_64.yml / build-aarch64.yml 里（一个架构一个工作流），所以新增架构要改三处：
# 新建 build-<arch>.yml、在本文件加一个 build-<arch> job、往 BUILD_TARGETS 里加一项。
#
# Tag rule: v<PKG_VERSION>-r<PKG_RELEASE>, matching the package version exactly.
# A local fix that only bumps PKG_RELEASE therefore gets its own tag instead of
# silently overwriting the previous release (dispatch with `force` to publish it).
#
# Release notes list only what changed: the upstream version bump plus any repo
# commits since the previous release tag. Package contents, WebUI provenance,
# install steps and the unofficial-build notice live in README.md - keeping a
# second copy here is how the two drift apart.
#
# The probe itself is cheap (two HTTP requests), so a "nothing changed" day
# costs seconds. Only `changed == true` starts the expensive build.

env:
  # x86/64 : generic PC / PVE VM
  # rockchip/armv8 : NanoPi R2S (friendlyarm_nanopi-r2s) and other RK3328/RK3399
  BUILD_TARGETS: '["x86/64","rockchip/armv8"]'


on:
  schedule:
    # 02:23 UTC == 10:23 Asia/Shanghai, every day.
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: OpenWrt release to build against
        required: true
        default: '25.12.6'
      force:
        description: 'Build and publish even if upstream has no new version'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Never let two probes race on the Makefile.
concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  check:
    name: probe upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      version: ${{ steps.bump.outputs.version }}
      release: ${{ steps.bump.outputs.release }}
      previous: ${{ steps.bump.outputs.previous }}
      previous_release: ${{ steps.bump.outputs.previous_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Probe upstream and bump the package
        id: bump
        run: |
          set -eu
          MAKE=Makefile

          previous="$(sed -n 's/^PKG_VERSION:=//p' "$MAKE" | head -n1)"
          previous_release="$(sed -n 's/^PKG_RELEASE:=//p' "$MAKE" | head -n1)"
          previous_hash="$(sed -n 's/^PKG_HASH:=//p' "$MAKE" | head -n1)"
          sh scripts/sync-upstream.sh
          version="$(sed -n 's/^PKG_VERSION:=//p' "$MAKE" | head -n1)"
          # sync-upstream.sh 在换 PKG_VERSION 时会把 PKG_RELEASE 重置为 1；
          # 若是本地修 bug 只升了 PKG_RELEASE，这里读到的就是新修订号。
          release="$(sed -n 's/^PKG_RELEASE:=//p' "$MAKE" | head -n1)"
          hash="$(sed -n 's/^PKG_HASH:=//p' "$MAKE" | head -n1)"

          echo "upstream=$version  local=$previous"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "release=$release"   >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "previous_release=$previous_release" >> "$GITHUB_OUTPUT"
          echo "previous_hash=$previous_hash" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

          if [ "$version" != "$previous" ]; then
            echo "changed=true"     >> "$GITHUB_OUTPUT"
            echo "hash_drift=false" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet -- "$MAKE"; then
            # 版本号没变，但 sync-upstream.sh 改动了 Makefile ⇒ 只可能是哈希漂移：
            # GitHub 重新生成了 tag 归档，或上游把 tag 指到了别的提交。
            #
            # 旧逻辑在这里把改动直接丢掉（只按版本号判 changed），于是仓库里的
            # PKG_HASH 停在上一份归档的值，之后任何一次编译都会在下载源码时
            # 哈希校验失败 —— 报错离原因很远，很难查。
            echo "changed=false"    >> "$GITHUB_OUTPUT"
            echo "hash_drift=true"  >> "$GITHUB_OUTPUT"
          else
            echo "changed=false"    >> "$GITHUB_OUTPUT"
            echo "hash_drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the version bump
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile
          git commit -m "oxidns: update to ${VERSION}"
          git push origin "HEAD:${{ github.ref_name }}"

      # 版本没变、只有归档字节变了（GitHub 重新生成 tag 归档 / 上游改 tag 指向）。
      # 必须把新的 PKG_HASH 提交掉，否则仓库里的 hash 会一直指向旧归档，
      # 下一次 `make` 在下载源码时就哈希校验失败。
      - name: Commit a hash-only fix
        if: steps.bump.outputs.hash_drift == 'true'
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile
          git commit -m "fix: 更新 PKG_HASH（上游归档字节变化）"
          git push origin "HEAD:${{ github.ref_name }}"
          {
            echo ''
            echo '> 上游归档字节变了但 `PKG_VERSION` 没变，已提交新的 `PKG_HASH`。'
            echo '> 未触发编译：tag 不变，已发布的 APK 仍对应上一份归档。'
            echo '> 若要按新归档重新出包，手动 dispatch 本工作流并勾选 `force`。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          {
            echo '### Upstream probe'
            echo ''
            echo '| | |'
            echo '|---|---|'
            echo "| upstream | ${{ steps.bump.outputs.version }} |"
            echo "| local before | ${{ steps.bump.outputs.previous }}-r${{ steps.bump.outputs.previous_release }} |"
            echo "| package version | ${{ steps.bump.outputs.version }}-r${{ steps.bump.outputs.release }} |"
            echo "| changed | ${{ steps.bump.outputs.changed }} |"
            echo "| hash drift | ${{ steps.bump.outputs.hash_drift }} |"
            if [ '${{ steps.bump.outputs.hash_drift }}' = 'true' ]; then
              echo ''
              echo '`PKG_HASH` 的旧值 → 新值：'
              echo ''
              echo '```'
              echo "old ${{ steps.bump.outputs.previous_hash }}"
              echo "new ${{ steps.bump.outputs.hash }}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 缓存保活：上游没升级（也没 force）时不构建，build job 不会恢复缓存 —— 而
  # GitHub 的 Actions 缓存按「最后访问时间」7 天不访问即驱逐，放任不管的话
  # 冷跑一次 rust host toolchain 要 3-6 小时。这里在不构建的日子里用
  # cache/restore（只恢复、不回存）把两份缓存各摸一次，刷新驱逐时钟；
  # 真正的升级构建走 build job，天然会恢复缓存，不需要本 job。
  # 与版本检查合并在同一个 workflow 里：升级 → 构建发版；没升级 → 只保活，
  # 不发 Release。
  keepalive:
    name: keep build caches warm (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.changed != 'true' && github.event.inputs.force != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # 与 build.yml 里 TARGET_ID 的取值保持一致（x86/64 -> x86-64 等）。
        target: ['x86-64', 'rockchip-armv8']
    env:
      SDK_VERSION: ${{ inputs.sdk_version || '25.12.6' }}
    steps:
      # 恢复到 RUNNER_TEMP 即可：缓存按 key 寻址，与 build 的落盘路径无关，
      # restore 动作本身就刷新 last_accessed_at。
      - name: Touch host toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/keepalive-warm/host
          key: keepalive-host-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: openwrt-host-${{ env.SDK_VERSION }}-${{ matrix.target }}-v2

      - name: Touch SDK archive cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/keepalive-warm/sdk
          key: keepalive-sdk-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: sdk-archive-${{ env.SDK_VERSION }}-${{ matrix.target }}

      - name: Summary
        run: |
          {
            echo "### Cache keepalive (\`${{ matrix.target }}\`)"
            echo ''
            echo '上游无新版本，未构建；已恢复构建缓存刷新 7 天驱逐时钟（不发 Release）。'
          } >> "$GITHUB_STEP_SUMMARY"

  # 每个架构一个 job，各自调用自己的单架构工作流：缓存 key、超时、日志都独立，
  # armv8 冷缓存慢或失败不会掩盖 x86 的结果。publish 汇总两边的产物发一个 Release。
  build-x86_64:
    name: build x86_64
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-x86_64.yml
    with:
      sdk_version: ${{ inputs.sdk_version || '25.12.6' }}

  build-aarch64:
    name: build aarch64
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-aarch64.yml
    with:
      sdk_version: ${{ inputs.sdk_version || '25.12.6' }}

  publish:
    name: publish release
    needs: [ check, build-x86_64, build-aarch64 ]
    if: needs.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # gh derives the target repository from the git remote. Follow the branch
      # tip so the Makefile read here agrees with the packages just built (the
      # probe job pushed the version bump after the run started).
      #
      # fetch-depth 0 also brings the tags: the notes step walks
      # `<previous release tag>..HEAD` to list the repo-side changes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check packages
        run: |
          set -eu
          find dist -type f -printf '%p  %s bytes\n' | sort
          count="$(find dist -type f -name '*.apk' | wc -l)"
          echo "apk count: $count"
          [ "$count" -gt 0 ] || { echo 'no .apk produced - nothing to publish' >&2; exit 1; }

      # Guard against shipping a package whose contents disagree with the tag,
      # which is exactly what happened before: v1.6.0 was published carrying a
      # 1.5.2 build. Also catches the Makefile drifting from the probe's output.
      - name: Verify package versions against the Makefile
        env:
          VERSION: ${{ needs.check.outputs.version }}
          RELEASE: ${{ needs.check.outputs.release }}
        run: |
          set -eu
          make_version="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n1)"
          make_release="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n1)"
          printf 'probe reported %s-r%s, Makefile has %s-r%s\n' \
            "$VERSION" "$RELEASE" "$make_version" "$make_release"
          if [ "${VERSION}-r${RELEASE}" != "${make_version}-r${make_release}" ]; then
            echo "::error::the probe's version differs from the checked out Makefile" >&2
            exit 1
          fi
          sh scripts/check-apk-version.sh "${VERSION}-r${RELEASE}" dist/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          RELEASE: ${{ needs.check.outputs.release }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
        run: |
          set -eu
          # 架构列表来自 workflow 级 BUILD_TARGETS，正文/标题都从它派生，
          # 避免"加了架构但 Release 里还写 x86_64"这种漂移。
          targets_note="$(printf '%s' "$BUILD_TARGETS" | sed 's/[][]//g; s/","/ + /g; s/"//g')"
          echo "targets: $targets_note"

          # 完整包版本 = PKG_VERSION-PKG_RELEASE。tag 必须带上 -r，否则同一上游版本下
          # 只升 PKG_RELEASE（修 bug / 改安装产物）会撞上已有 tag，变成静默覆盖旧 Release。
          tag="v$VERSION-r$RELEASE"

          # 正文只写本次变动。包内容 / WebUI 来源 / 安装步骤 / 非官方声明都在
          # README.md 里，不再往这里抄一份 —— 抄来的副本迟早和 README 漂移。
          if [ "$PREVIOUS" = "$VERSION" ]; then
            # force 重编：上游版本没动，变的只是包本身。
            printf '上游仍为 `v%s`，包 `%s-r%s` 重新编译（OpenWrt 25.12，%s）。\n\n' \
              "$VERSION" "$VERSION" "$RELEASE" "$targets_note" > notes.md
          else
            printf '上游 OxiDNS `v%s` → `v%s`，包 `%s-r%s` 重新编译（OpenWrt 25.12，%s）。\n\n' \
              "$PREVIOUS" "$VERSION" "$VERSION" "$RELEASE" "$targets_note" > notes.md
            printf '上游变更：https://github.com/svenshi/oxidns/compare/v%s...v%s\n\n' \
              "$PREVIOUS" "$VERSION" >> notes.md
          fi

          # 本次发版包含的仓库内改动 = 上一个 release tag 到 HEAD 之间的提交。
          # 过滤两类：探测任务自己推的版本 bump（上一段已写）、以及 docs/ci 这类
          # 不影响安装产物的提交 —— Release 只面向装机的人，内部改动留 commit 历史。
          prev_tag="$(git tag --list 'v*-r*' --sort=-v:refname | head -n1)"
          if [ -n "$prev_tag" ] && git cat-file -e "${prev_tag}^{commit}" 2>/dev/null; then
            changes="$(git log --no-merges --pretty=format:'- %s' \
              --invert-grep \
              --grep='^oxidns: update to ' --grep='^docs:' --grep='^ci:' \
              "${prev_tag}..HEAD")"
            if [ -n "$changes" ]; then
              printf '包内改动：\n%s\n\n' "$changes" >> notes.md
            fi
          fi

          printf '包内容与安装方式见 [README](%s/%s#readme)。\n' \
            "${GITHUB_SERVER_URL:-https://github.com}" "${GITHUB_REPOSITORY:-}" >> notes.md

          cat notes.md
          echo '-----------------------------'

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists - uploading assets"
            gh release upload "$tag" dist/*.apk --clobber
          else
            gh release create "$tag" dist/*.apk \
              --title "OxiDNS $VERSION-r$RELEASE (OpenWrt $targets_note)" \
              --notes-file notes.md
          fi

          gh release view "$tag" --json url,tagName,assets \
            --jq '.url, .tagName, (.assets[] | "  " + .name + "  " + (.size | tostring) + " bytes")'
