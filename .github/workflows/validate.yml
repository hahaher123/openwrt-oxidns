name: validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: package metadata and files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate repository
        run: sh scripts/validate.sh

      # Stubs curl/tar/make, so it is offline and takes a second. Guards the
      # feed repointing and the rust version check that broke the first
      # scheduled build.
      - name: build-sdk.sh regression test
        run: sh scripts/test-build-sdk.sh
